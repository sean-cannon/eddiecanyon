<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eddie Canyon</title>
    <style>
        /* General Styles */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background-color: #000; /* Black background */
            color: #fff;
        }

        /* Hero Section */
        .hero {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 0 1rem;
        }

        .hero h1 {
            font-size: 4rem;
            color: #ffcc00; /* Yellow title accent */
            margin: 0;
        }

        .hero h2 {
            font-size: 1.5rem;
            font-weight: 300;
            color: #fff;
            margin-top: 1rem;
        }

        .hero h2 span {
            color: #ffcc00; /* Yellow accent for keyword */
        }

        /* Call to Action Button */
        .hero .cta {
            margin-top: 2rem;
        }

        .hero .cta a {
            display: inline-block;
            padding: 1rem 2rem;
            font-size: 1rem;
            font-weight: bold;
            color: #000;
            background-color: #ffcc00; /* Yellow button */
            border: none;
            border-radius: 30px;
            text-decoration: none;
            transition: transform 0.2s, background-color 0.2s;
        }

        .hero .cta a:hover {
            background-color: #e6b800; /* Slightly darker yellow on hover */
            transform: scale(1.05);
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 1rem;
            font-size: 0.875rem;
            color: #666;
            background-color: #111;
        }

        footer a {
            color: #ffcc00;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <!-- Hero Section -->
    <div class="hero">
        <h1>Eddie Canyon</h1>
        <h2><span>Not</span> for the surface dwellers</h2>
        <div class="cta">
            <a href="think.html">Explore the Depths</a>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        © 2024 Eddie Canyon. Built with passion. Follow me on <a href="socials.html">Socials</a>.
    </footer>
</body>
</html>
